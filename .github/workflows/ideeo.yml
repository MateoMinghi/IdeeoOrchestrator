name: Ideeo isolated verification

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDEEO_TEST_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm exec tsc --noEmit -p tsconfig.server.json
      - run: pnpm exec tsc --noEmit -p tsconfig.ideeo-server.json
      - run: pnpm typecheck:ideeo-ui
      - run: pnpm i18n:check
      - run: pnpm exec oxlint server/ideeo server/routes/ideeo-conversations.ts src/ideeo scripts/testing/ideeo-ui.ts scripts/testing/live-free-form.ts scripts/testing/model-fixture.ts scripts/testing/payme-storage-worker.ts
      - run: node --experimental-strip-types --test --test-concurrency=1 server/ideeo/identity.node-test.ts server/ideeo/admission.node-test.ts server/ideeo/storage/conversations.node-test.ts server/ideeo/conversation-loop.node-test.ts server/ideeo/free-form.node-test.ts server/ideeo/gemini.node-test.ts server/ideeo/deadlines.node-test.ts server/ideeo/restart.node-test.ts server/ideeo/wire-diagnostics.node-test.ts server/ideeo/workspace-budget.node-test.ts server/ideeo/openmaus-tools.node-test.ts src/ideeo/client.node-test.ts
      - run: pnpm test:ideeo-free-form-mutation
      - run: pnpm build:ideeo-ui
